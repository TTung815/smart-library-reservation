services:
  # 1. PostgreSQL Database (Source of Truth)
  postgres:
    image: postgres:16-alpine
    container_name: smart-library-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-library_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - library_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d library_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # 2. Redis In-Memory Data Store (Fast lookup & FIFO queue)
  redis:
    image: redis:7-alpine
    container_name: smart-library-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - library_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 3s

  # 3. Apache Kafka (Event Streaming in modern KRaft mode - No ZooKeeper required)
  kafka:
    image: apache/kafka:3.7.0
    container_name: smart-library-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - library_network
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # 4. Library Service (FastAPI + PostgreSQL + Kafka Producer)
  library-service:
    build:
      context: .
      dockerfile: services/library_service/Dockerfile
    container_name: smart-library-service
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/library_db
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC_RESERVATIONS: book-reservations
      KAFKA_ENABLED: "true"
      LOG_LEVEL: INFO
    command: >
      sh -c "alembic upgrade head &&
             python -m services.library_service.src.scripts.seed &&
             uvicorn services.library_service.src.main:app --host 0.0.0.0 --port 8001"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - library_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/v1/health"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 5. Reservation Service (FastAPI + Redis + Kafka Consumer)
  reservation-service:
    build:
      context: .
      dockerfile: services/reservation_service/Dockerfile
    container_name: smart-reservation-service
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      APP_ENV: production
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC_RESERVATIONS: book-reservations
      KAFKA_GROUP_ID: reservation-service-group
      KAFKA_ENABLED: "true"
      LOG_LEVEL: INFO
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - library_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/api/v1/health"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 6. Nginx Reverse Proxy / API Gateway (Single Entry Point)
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: smart-library-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      library-service:
        condition: service_healthy
      reservation-service:
        condition: service_healthy
    networks:
      - library_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

networks:
  library_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  kafka_data:

