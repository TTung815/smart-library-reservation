name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # 1. Chạy kiểm thử tự động và đo độ bao phủ mã nguồn
  test:
    name: Run Automated Tests & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/library_service/requirements.txt
          pip install -r services/reservation_service/requirements.txt

      - name: Run pytest with coverage report
        run: |
          PYTHONPATH=. pytest -v --cov=services/ --cov-report=term-missing tests/

  # 2. Kiểm tra Docker build cho cả 3 services & validate Docker Compose
  build-docker:
    name: Build & Validate Docker Images
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate docker-compose.yml configuration
        run: |
          docker compose config

      - name: Build Library Service Image
        run: |
          docker build -t smart-library-service:latest -f services/library_service/Dockerfile .

      - name: Build Reservation Service Image
        run: |
          docker build -t smart-reservation-service:latest -f services/reservation_service/Dockerfile .

      - name: Build Nginx Image
        run: |
          docker build -t smart-library-nginx:latest nginx/

