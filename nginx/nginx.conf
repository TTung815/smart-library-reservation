worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/json;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Định nghĩa các backend services trong mạng nội bộ Docker
    upstream library_backend {
        server library-service:8001;
        keepalive 32;
    }

    upstream reservation_backend {
        server reservation-service:8002;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        # Cấu hình Proxy Headers chung
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout settings
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # 1. Gateway Health Check & Root Info
        location = /health {
            access_log off;
            add_header Content-Type application/json;
            return 200 '{"status":"ok","gateway":"nginx"}';
        }

        location = / {
            add_header Content-Type application/json;
            return 200 '{"system":"Smart Library - Asynchronous Book Reservation System","gateway":"nginx","status":"healthy"}';
        }

        # 2. Health checks của từng service qua Gateway
        location /health/library {
            proxy_pass http://library_backend/api/v1/health;
        }

        location /health/reservation {
            proxy_pass http://reservation_backend/api/v1/health;
        }

        # 3. Định tuyến các API quản lý sách và mượn sách -> Library Service
        location /api/v1/books {
            proxy_pass http://library_backend;
        }

        location /api/v1/borrow {
            proxy_pass http://library_backend;
        }

        # 4. Định tuyến API tra cứu đặt chỗ và hàng đợi -> Reservation Service
        location /api/v1/reservations {
            proxy_pass http://reservation_backend;
        }

        # Trả về 404 JSON nếu đường dẫn không tồn tại
        error_page 404 = @not_found;
        location @not_found {
            return 404 '{"detail":"Route not found on API Gateway"}';
        }
    }
}
